name: Deploy Frontend to S3 + CloudFront

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install html5validator
      run: pip install html5validator

    - name: Validate HTML
      run: |
        OUTPUT=$(html5validator --root . --ignore-re ".git/*" ".github/*" 2>&1) || true
        echo "$OUTPUT"
        REAL_ERRORS=$(echo "$OUTPUT" | grep -i "error" | grep -v "backdrop-filter" || true)
        if [ -n "$REAL_ERRORS" ]; then
          echo "Real validation errors found:"
          echo "$REAL_ERRORS"
          exit 1
        fi
        echo "Validation passed (ignoring known backdrop-filter false positive)"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Sync frontend to S3
      run: |
        aws s3 sync ./frontend s3://${{ secrets.S3_BUCKET }} --delete --exclude ".git/*" --exclude ".github/*"

    - name: Invalidate CloudFront cache
      if: env.CLOUDFRONT_DIST_ID != ''
      env:
        CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
      run: |
        aws cloudfront create-invalidation \
          --distribution-id $CLOUDFRONT_DIST_ID \
          --paths "/*"